          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
components:
  schemas:
    CsrfResponse:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    IdentityUser:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        is_active:
          type: boolean
        groups:
          type: array
          items: {}
        permissions:
          type: array
          items: {}
      required:
      - email
      - groups
      - id
      - is_active
      - permissions
      - username
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    LoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/IdentityUser'
        session_active:
          type: boolean
      required:
      - session_active
      - user
    LogoutResponse:
      type: object
      properties:
        logged_out:
          type: boolean
      required:
      - logged_out
    RegisterRequest:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
        email:
          type: string
          format: email
      required:
      - password
      - username
